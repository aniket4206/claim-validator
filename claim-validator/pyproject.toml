[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "claim-validator"
dynamic = ["version"]
description = "Open-source healthcare claim validation library with rule-based and AI-powered checks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "aniket" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0,<3.0", "pydantic-settings>=2.0,<3.0"]

[project.scripts]
claim-validator = "claim_validator.cli:main"

[project.optional-dependencies]
ai = ["httpx>=0.27", "anthropic>=0.40", "openai>=1.50"]
anthropic = ["httpx>=0.27", "anthropic>=0.40"]
openai = ["httpx>=0.27", "openai>=1.50"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.30"]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.110"]
stedi = ["httpx>=0.27"]
claimmd = ["httpx>=0.27"]
waystar = ["httpx>=0.27"]
change = ["httpx>=0.27"]
availity = ["httpx>=0.27"]
resilience = ["tenacity>=8.2"]
all-clearinghouses = ["httpx>=0.27", "tenacity>=8.2"]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5", "mypy>=1.10", "factory-boy>=3.3"]
all = ["claim-validator[ai,server,django,fastapi,all-clearinghouses]"]

[project.urls]
Homepage = "https://github.com/aniket/claim-validator"
Repository = "https://github.com/aniket/claim-validator"
Documentation = "https://github.com/aniket/claim-validator#readme"
Issues = "https://github.com/aniket/claim-validator/issues"

[tool.hatch.version]
source = "vcs"
raw-options.root = ".."
raw-options.relative_to = "pyproject.toml"

[tool.hatch.build.hooks.vcs]
version-file = "src/claim_validator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_validator"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/claim_validator/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["src/claim_validator/_version\\.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
