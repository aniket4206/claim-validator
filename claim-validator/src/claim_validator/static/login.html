<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThinkAI - Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1923;
      --bg-card: #162231;
      --bg-input: #1a2a3a;
      --text: #e8ecf1;
      --text-secondary: #8899aa;
      --text-muted: #5a6a7a;
      --border: #243447;
      --primary: #00d4aa;
      --primary-dark: #00b894;
      --primary-glow: rgba(0, 212, 170, 0.15);
      --error: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 8px;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .logo-accent {
      color: var(--primary);
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .form-group input.input-error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .remember-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #0f1923;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    .btn-login:hover {
      background: var(--primary-dark);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--error);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .credentials-hint {
      background: rgba(0, 212, 170, 0.08);
      border: 1px solid rgba(0, 212, 170, 0.2);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .credentials-hint strong {
      color: var(--primary);
    }

    .spinner-sm {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(15, 25, 35, 0.3);
      border-top-color: #0f1923;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-text">Think<span class="logo-accent">AI</span></span>
      </div>
      <p class="login-subtitle">Eligibility & Benefits Verification</p>

      <div id="error-msg" class="error-msg"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        <div class="remember-row">
          <label>
            <input type="checkbox" id="remember" checked /> Remember me
          </label>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Sign In</button>
      </form>

      <div class="login-divider">Demo Credentials</div>
      <div class="credentials-hint">
        <strong>Admin:</strong> admin / admin123<br />
        <strong>Staff:</strong> staff / staff123
      </div>
    </div>
    <div class="login-footer">
      &copy; 2026 ThinkAI Healthcare Solutions
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errEl.textContent = 'Please enter both username and password';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span> Signing in...';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (res.ok && data.token) {
          // Store token in storage and cookie
          const storage = document.getElementById('remember').checked ? localStorage : sessionStorage;
          storage.setItem('auth_token', data.token);
          storage.setItem('auth_user', JSON.stringify(data.user));
          // Cookie is also set by server response, but set it client-side too for safety
          document.cookie = 'auth_token=' + data.token + '; path=/; max-age=' + (86400 * 7) + '; samesite=lax';

          // Redirect to main app
          window.location.href = '/';
        } else {
          errEl.textContent = data.detail || 'Invalid username or password';
          errEl.style.display = 'block';
          document.getElementById('password').classList.add('input-error');
          document.getElementById('password').focus();
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Clear error styling on input
    document.getElementById('password').addEventListener('input', function() {
      this.classList.remove('input-error');
      document.getElementById('error-msg').style.display = 'none';
    });
    document.getElementById('username').addEventListener('input', function() {
      document.getElementById('error-msg').style.display = 'none';
    });

    // If already logged in, redirect
    const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
    if (token) {
      // Verify token is still valid
      fetch('/api/v1/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(res => {
        if (res.ok) window.location.href = '/';
      });
    }
  </script>
</body>
</html>
